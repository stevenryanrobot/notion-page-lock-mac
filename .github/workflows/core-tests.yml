name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js src/*.cjs scripts/*.mjs tests/*.cjs; do
            node --check "$file"
          done
